<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sign up — SmartBite Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="demo-banner"><p class="mb-0">Demo build — mock accounts only, nothing is stored beyond your browser. <a href="https://elichaamhanna.netlify.app/projects/smartbite.html">Back to project details</a></p></div>
<div id="navbar-root"></div>

<main class="container py-5" style="max-width: 420px;">
  <h1 class="h3 mb-4">Create an account</h1>
  <div class="alert alert-secondary small">This is a demo. No real account is created — the password field is decorative and is never read, validated, or sent anywhere.</div>
  <form id="signupForm">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-warning w-100">Create account</button>
  </form>
  <p class="text-center mt-3 small">Already have an account? <a href="signin.html">Sign in</a></p>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/session.js"></script>
<script src="js/cart.js"></script>
<script src="js/reviews.js"></script>
<script src="js/chat.js"></script>
<script src="js/chrome.js"></script>
<script src="js/toast.js"></script>
<script src="js/page-signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Menu — SmartBite Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="demo-banner"><p class="mb-0">Demo build — mock data, no real backend. <a href="https://elichaamhanna.netlify.app/projects/smartbite.html">Back to project details</a></p></div>
<div id="navbar-root"></div>

<main class="container py-4">
  <h1 class="h3 mb-4">Menu</h1>

  <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
    <div class="btn-group flex-wrap" id="categoryTabs" role="group" aria-label="Menu categories"></div>
    <input type="search" id="menuSearch" class="form-control ms-lg-auto" style="max-width: 260px;" placeholder="Search the menu…">
  </div>

  <div id="menuGrid" class="row g-4"></div>
  <p id="noResults" class="text-muted mt-4" hidden>No dishes match your search.</p>
</main>

<div id="footer-root"></div>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3 sb-toast-container">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div id="toastBody" class="toast-body"></div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/session.js"></script>
<script src="js/cart.js"></script>
<script src="js/reviews.js"></script>
<script src="js/chat.js"></script>
<script src="js/chrome.js"></script>
<script src="js/toast.js"></script>
<script src="js/page-menu.js"></script>
</body>
</html>

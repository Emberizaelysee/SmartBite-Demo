
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBite Purchase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="css/purchase.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div style="background:#1a1a1a;color:#f4ede4;font-size:0.82rem;text-align:center;padding:6px 14px;">Demo build &mdash; real frontend code, mock backend. Nothing here is stored or sent anywhere. <a href="https://elichaamhanna.netlify.app/projects/smartbite.html" style="color:#ffb98f;">Back to project details</a></div>
<script src="js/demo-data.js"></script>
<script src="js/demo-store.js"></script>
<script src="js/demo-shim.js"></script>

<div class="container my-5">

<div class="section-header">
  <h2>Order Summary</h2>
  <div class="divider"></div>
</div>

<div class="order-box">
  <p>Order Number: <strong>#3</strong></p>
</div>

<div class="table-responsive">
<table class="table text-center align-middle">
<thead>
<tr>
  <th>Product</th>
  <th>Quantity</th>
  <th>Price</th>
</tr>
</thead>
<tbody>
<tr>
  <td>MARGHERITA PIZZA</td>
  <td>1</td>
  <td>$5.00</td>
</tr>
</tbody>
<tfoot>
<tr>
  <td colspan="2" class="text-end">Total:</td>
  <td><strong>$5.00</strong></td>
</tr>
</tfoot>
</table>
</div>

<div class="cart-summary">
  <h4>Total Paid: <strong>$5.00</strong></h4>

  <div class="cart-actions">
    <form method="post" action="purchase.html" style="display:inline">
      <button type="submit" name="confirm_order" value="1" class="btn btn-green">Confirm order</button>
    </form>

    <a href="index.html" class="btn-outline-green">
      <i class="fa-solid fa-arrow-left"></i> Continue Shopping
    </a>
  </div>
</div>

</div>

<footer class="text-center py-4 text-muted border-top small">
  © 2026 SmartBite Restaurants. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

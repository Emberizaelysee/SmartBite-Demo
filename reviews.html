<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reviews — SmartBite Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="demo-banner"><p class="mb-0">Demo build — mock data, no real backend. <a href="https://elichaamhanna.netlify.app/projects/smartbite.html">Back to project details</a></p></div>
<div id="navbar-root"></div>

<main class="container py-4" style="max-width: 720px;">
  <h1 class="h3 mb-4">Reviews</h1>

  <form id="reviewForm" class="card card-body mb-4">
    <div class="mb-3">
      <label class="form-label" for="reviewDish">Dish</label>
      <select class="form-select" id="reviewDish"></select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reviewRating">Rating</label>
      <select class="form-select" id="reviewRating">
        <option value="5">5 — Excellent</option>
        <option value="4">4 — Good</option>
        <option value="3">3 — Okay</option>
        <option value="2">2 — Not great</option>
        <option value="1">1 — Poor</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reviewText">Your review</label>
      <textarea class="form-control" id="reviewText" rows="2" required></textarea>
    </div>
    <button type="submit" class="btn btn-warning">Post review</button>
  </form>

  <div id="reviewList"></div>
</main>

<div id="footer-root"></div>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3 sb-toast-container">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div id="toastBody" class="toast-body"></div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/session.js"></script>
<script src="js/cart.js"></script>
<script src="js/reviews.js"></script>
<script src="js/chat.js"></script>
<script src="js/chrome.js"></script>
<script src="js/toast.js"></script>
<script src="js/page-reviews.js"></script>
</body>
</html>

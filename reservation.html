<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reservations — SmartBite Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="demo-banner"><p class="mb-0">Demo build — mock data, no real backend. <a href="https://elichaamhanna.netlify.app/projects/smartbite.html">Back to project details</a></p></div>
<div id="navbar-root"></div>

<main class="container py-4" style="max-width: 560px;">
  <h1 class="h3 mb-4">Book a table</h1>
  <div id="reservationResult"></div>
  <form id="reservationForm">
    <div class="mb-3">
      <label class="form-label" for="resName">Name</label>
      <input class="form-control" id="resName" required>
    </div>
    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label" for="resDate">Date</label>
        <input type="date" class="form-control" id="resDate" required>
      </div>
      <div class="col-6 mb-3">
        <label class="form-label" for="resTime">Time</label>
        <input type="time" class="form-control" id="resTime" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="resParty">Party size</label>
      <input type="number" min="1" max="20" class="form-control" id="resParty" value="2" required>
    </div>
    <button type="submit" class="btn btn-warning btn-lg w-100">Book table</button>
  </form>

  <h2 class="h5 mt-5">Your reservations</h2>
  <div id="reservationList" class="text-muted">No reservations yet.</div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/session.js"></script>
<script src="js/cart.js"></script>
<script src="js/reviews.js"></script>
<script src="js/chat.js"></script>
<script src="js/chrome.js"></script>
<script src="js/toast.js"></script>
<script src="js/page-reservation.js"></script>
</body>
</html>
